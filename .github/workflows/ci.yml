### Pull-request checks.
#
# Deliberately does not hit the FIVB API — pull requests should not generate
# outbound traffic to a free third-party service on every push. The scheduled
# deploy workflow is the only thing that talks to VIS.
#
# The full build (not just `vite build`) is possible here, prerender included,
# because `web/public/v1/` is committed data now rather than something only
# `ingest` produces — a PR checkout already has real data to build and
# prerender against, so this is genuine coverage of the prerender step, not a
# stub that skips it.

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Built with the same BASE_PATH and SITE_URL the deploy uses, so the
      # artifact the smoke suite exercises is the one that would ship. Built
      # bare (base "/") this step used to pass while a base-path-sensitive
      # break — a wrong asset URL, a bad canonical — sailed through to deploy.
      - id: origin
        uses: ./.github/actions/site-origin
        with:
          site_url: ${{ vars.SITE_URL }}

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.origin.outputs.base_path }}
          SITE_URL: ${{ steps.origin.outputs.site_url }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built site
        run: npm run test:e2e
        env:
          BASE_PATH: ${{ steps.origin.outputs.base_path }}
          SITE_URL: ${{ steps.origin.outputs.site_url }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
