### Weekly rebuild + publish to Cloudflare Pages.
#
# The alternative publish target to deploy.yml (GitHub Pages), for when the
# site is served from Cloudflare rather than github.io. Same pipeline, same
# checks, same failure semantics — read deploy.yml's header for why it is
# shaped this way; everything there applies here, and only the last step
# differs.
#
# ## Only one of the two ever runs
#
# Both workflows are triggered by the same events, and two of them publishing
# from the same schedule would fetch FIVB's entire archive twice a week and
# race to commit the result. So each is gated on the DEPLOY_TARGET repository
# variable and they are mutually exclusive:
#
#   DEPLOY_TARGET unset or anything else  ->  deploy.yml         (GitHub Pages)
#   DEPLOY_TARGET = cloudflare            ->  this file
#
# The comparison is exact and case-sensitive. A typo ("Cloudflare") therefore
# leaves GitHub Pages publishing as before rather than leaving nothing
# publishing at all, which is the right way round for a mistake to fall.
#
# ## Keeping the two in step
#
# This file duplicates deploy.yml's ingest and build stages. That duplication
# has already cost once: written before the smoke suite, the deploy
# verification, the ingest/build split and the regression bypass existed, this
# workflow silently fell five pull requests behind, and enabling it would have
# quietly dropped every one of those checks. If you change the pipeline in
# deploy.yml, change it here too — and see docs/hosting.md for the durable fix
# (one pipeline, publish target as a parameter), which is worth doing at the
# point this target is actually adopted rather than speculatively now.
#
# ## Setup
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN    a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard URL
# Repository variables:
#   DEPLOY_TARGET           set to `cloudflare` to hand publishing to this file
#   SITE_URL                the public origin, e.g. https://beachvolleyball.com.br
#   CLOUDFLARE_PROJECT      Pages project name (defaults to beachvolleyballgraph)
#
# SITE_URL is required here, not optional: Cloudflare Pages serves from a
# domain root, and canonical tags, Open Graph and sitemap.xml are baked in at
# build time. The preflight step below fails the run rather than publishing
# 265 pages that claim to live at example.invalid.

name: Rebuild data and deploy (Cloudflare)

on:
  schedule:
    # Sundays at 03:17 UTC. Off the hour to avoid the cron stampede.
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      allow_data_regression:
        description: >-
          Publish even if tournaments/players/partnerships drop more than 5%
          from what's already committed. The weekly schedule never sets this —
          it exists for a deliberate, reviewed correction (e.g. a tier
          reclassification) that legitimately shrinks the dataset, which
          ingest/regression.ts would otherwise refuse on the assumption that a
          drop that size means FIVB handed back a broken response. The drop is
          logged either way.
        type: boolean
        default: false
  push:
    branches: [main]

# Allow one publish at a time; don't cancel a run that is mid-deploy.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    # Skipped on a plain code push: nothing to fetch, and the committed data
    # already reflects the last successful refresh.
    if: vars.DEPLOY_TARGET == 'cloudflare' && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the refreshed data back to this branch
    outputs:
      data_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Fetch FIVB data and build graphs
        run: npm run ingest
        env:
          # Identify the job to FIVB, contact address included, so a free
          # service with a problem can email us rather than null-route us.
          # Keep in step with CONTACT_EMAIL in web/src/site.ts.
          VIS_USER_AGENT: 'beachvolleyballgraph/1.0 (+https://github.com/${{ github.repository }}; beachgraph@picado.com.br)'
          # false on every trigger except a manual dispatch with the checkbox
          # ticked — schedule and workflow_dispatch runs that leave it
          # unchecked, and push (which skips this job entirely), all get 'false'.
          ALLOW_DATA_REGRESSION: ${{ github.event.inputs.allow_data_regression == 'true' }}

      - name: Summarise the published dataset
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = json.load(open('web/public/v1/manifest.json'))
          print("## Dataset rebuilt\n")
          print(f"- Generated: `{m['generatedAt']}`")
          print(f"- Seasons: {m['seasons']['from']}–{m['seasons']['to']}")
          print(f"- Tournaments: {m['totals']['tournaments']:,}")
          print(f"- Players: {m['totals']['players']:,}")
          print(f"- Partnerships: {m['totals']['partnerships']:,}")
          print(f"- Countries published: {len(m['countries'])}\n")
          print("| Tier | Tournaments |\n|---|---:|")
          for tier, n in sorted(m['tiers'].items(), key=lambda kv: -kv[1]):
              print(f"| {tier} | {n:,} |")
          PY

      - name: Commit refreshed data
        id: commit
        env:
          ALLOW_DATA_REGRESSION: ${{ github.event.inputs.allow_data_regression == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- web/public/v1)" ]; then
            echo "No data changes to commit."
          else
            suffix=""
            if [ "$ALLOW_DATA_REGRESSION" = "true" ]; then
              suffix=" [regression check bypassed — see run log for what shrank]"
            fi
            git add web/public/v1
            git commit -m "Refresh FIVB data ($(date -u +%Y-%m-%d))$suffix"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Build, smoke-test and publish in one job. deploy.yml splits publishing out
  # because the Pages actions hand an artifact between jobs; wrangler uploads
  # dist/ straight from the runner that built it, so a second job would only
  # add an artifact round-trip.
  deploy:
    needs: ingest
    # Runs whether ingest actually ran (schedule/dispatch) or was skipped (a
    # code-only push) — only a real ingest *failure* should stop the deploy.
    # `always()` is needed for the skipped case, which then makes the target
    # and ingest-result checks the only things standing between a failed
    # ingest and a publish, so both are spelled out.
    if: >-
      always() && vars.DEPLOY_TARGET == 'cloudflare'
      && (needs.ingest.result == 'success' || needs.ingest.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Check the target is configured
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$SITE_URL" ]   || missing="$missing SITE_URL(variable)"
          [ -n "$API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ -n "$ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(secret)"
          if [ -n "$missing" ]; then
            echo "::error::DEPLOY_TARGET is cloudflare but these are unset:$missing"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # The commit ingest just produced, if it ran; otherwise the pushed
          # commit this run started from, which already carries whatever data
          # was last committed.
          ref: ${{ needs.ingest.outputs.data_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: origin
        uses: ./.github/actions/site-origin
        with:
          site_url: ${{ vars.SITE_URL }}

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.origin.outputs.base_path }}
          SITE_URL: ${{ steps.origin.outputs.site_url }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs *before* the upload, so a build that doesn't render never reaches
      # Cloudflare and the previously published site keeps serving — the same
      # "degraded to slightly stale, never down" stance as the ingest failure
      # path. This is also the only check that sees the freshly fetched data:
      # the weekly ingest rewrites every graph file with no pull request and
      # no review.
      - name: Smoke test the built site
        run: npm run test:e2e
        env:
          BASE_PATH: ${{ steps.origin.outputs.base_path }}
          SITE_URL: ${{ steps.origin.outputs.site_url }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Two fingerprints of what is about to be published, for the check at the
      # end. Neither alone is enough: `generatedAt` only moves when the data
      # does, so on a code-only push it already matches what is live and a
      # deploy that shipped nothing would still pass; the hashed bundle name
      # moves whenever the code does and not at all when only the data
      # changes. Between them every real deploy changes at least one.
      #
      # The bundle name is a *content* hash, so a change that minifies away — a
      # comment, reformatting — leaves it identical. That is not a gap: the
      # published artifact really is byte-for-byte the same.
      - name: Record what this build should publish
        id: stamp
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, pathlib
          print("generated_at=" + json.load(open('web/public/v1/manifest.json'))['generatedAt'])
          html = pathlib.Path('dist/index.html').read_text(encoding='utf-8')
          m = re.search(r'src="[^"]*/(assets/index-[^"]+\.js)"', html)
          if not m:
              raise SystemExit('no hashed bundle found in dist/index.html')
          print("bundle=" + m.group(1))
          PY

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT || 'beachvolleyballgraph' }}
            --branch=main

      # Deliberately thin, and deliberately not the browser suite: nothing here
      # can roll anything back, the identical bytes were already exercised
      # pre-upload, and a long assertion against a CDN mid-propagation is a
      # flake generator. This answers one question the localhost runs
      # structurally cannot — did the build we just published actually become
      # the thing being served? Caught live once already on the Pages side: two
      # merges in a row reported success while the CDN kept serving the
      # previous build.
      #
      # Worth more here than on Pages, not less: a wrangler upload succeeding
      # says the *deployment* was created, which on Cloudflare is a different
      # question from whether the production alias now points at it.
      - name: Verify Cloudflare is serving this build
        env:
          EXPECTED_DATA: ${{ steps.stamp.outputs.generated_at }}
          EXPECTED_BUNDLE: ${{ steps.stamp.outputs.bundle }}
          SITE_URL: ${{ steps.origin.outputs.site_url }}
        run: |
          set -uo pipefail
          echo "Expecting data=$EXPECTED_DATA and bundle=$EXPECTED_BUNDLE at $SITE_URL"
          for attempt in 1 2 3 4 5 6; do
            live_data=$(curl -fsS --max-time 20 "${SITE_URL}/v1/manifest.json" \
                        | python3 -c 'import json,sys; print(json.load(sys.stdin)["generatedAt"])' 2>/dev/null || true)
            # Cache-bust: an edge holding the previous index.html is the very
            # thing being tested for, so don't let it answer from cache.
            live_html=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
                        "${SITE_URL}/?deploycheck=${GITHUB_RUN_ID}" 2>/dev/null || true)

            data_ok=false; bundle_ok=false
            [ "$live_data" = "$EXPECTED_DATA" ] && data_ok=true
            case "$live_html" in *"$EXPECTED_BUNDLE"*) bundle_ok=true ;; esac

            if [ "$data_ok" = true ] && [ "$bundle_ok" = true ]; then
              echo "Live site is serving this build (data $live_data, bundle $EXPECTED_BUNDLE)."
              exit 0
            fi
            echo "attempt $attempt: data_ok=$data_ok bundle_ok=$bundle_ok; waiting for propagation"
            sleep 15
          done
          echo "::error::$SITE_URL is not serving the build that just deployed."
          echo "::error::expected data=$EXPECTED_DATA got=${live_data:-<unreachable>}; expected bundle=$EXPECTED_BUNDLE (not found in live HTML)"
          exit 1
